name: regression-tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  decoder-image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sky-scanner:test .
      - run: docker run --rm sky-scanner:test python -m unittest discover -s tests -v
